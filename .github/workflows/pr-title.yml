name: Pull request title

# Pull requests are squash-merged, so the title becomes the commit message on
# main and decides the release. modulane/workflows checks that it is a
# lowercase Conventional Commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: Pull request title
    uses: modulane/workflows/.github/workflows/pr-title.yml@8a5ecaa4dc296a9e04849212ec06ddeec2a2480b # v1.0.0
    permissions:
      contents: read # list the files of a pull request in a private repository
      pull-requests: read # read the pull request title and its files
