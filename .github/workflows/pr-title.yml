name: Pull request title

# Pull requests are squash-merged, so the title becomes the commit message on
# main and decides the release (feat: minor, fix: patch, others none). Check
# that it follows Conventional Commits before it can be merged.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    name: Conventional Commit title
    runs-on: ubuntu-latest

    steps:
      - name: Check the title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # "feat: Add X" reads oddly in release notes; keep the summary lowercase.
          subjectPattern: ^[^A-Z].*$
          subjectPatternError: >-
            Start the summary "{subject}" with a lowercase letter, for example
            "feat: add project search".
