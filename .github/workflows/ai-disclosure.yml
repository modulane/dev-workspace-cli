name: AI disclosure

# Every pull request says whether AI tools were used, the maintainer's
# included: modulane/workflows fails until the "AI use" section of the
# description ticks exactly one box. The main ruleset requires this check.
# Dependabot pull requests are exempt.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  ai-disclosure:
    name: AI disclosure
    uses: modulane/workflows/.github/workflows/ai-disclosure.yml@8a5ecaa4dc296a9e04849212ec06ddeec2a2480b # v1.0.0
