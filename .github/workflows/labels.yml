name: Labels

# .github/labels.json is the list of labels this repository uses. When it
# changes on main, modulane/workflows creates the labels that are missing and
# updates the others. Labels that are not in the file are left alone.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
  workflow_dispatch:

permissions: {}

jobs:
  labels:
    name: Labels
    uses: modulane/workflows/.github/workflows/labels.yml@eeae1ae14ad19a1710cf529474323ebfb59bcc90 # v1.2.0
    permissions:
      contents: read # read .github/labels.json
      issues: write # create and edit labels
