name: Workflow security

# modulane/workflows audits the workflows with zizmor whenever a pull request
# changes them, so a regression (an unpinned action, a persisted token, a
# risky trigger) is caught before it reaches main.
on:
  pull_request:
    paths:
      - .github/**

permissions: {}

jobs:
  zizmor:
    name: Workflow security
    uses: modulane/workflows/.github/workflows/zizmor.yml@8a5ecaa4dc296a9e04849212ec06ddeec2a2480b # v1.0.0
    permissions:
      contents: read # read the workflows
