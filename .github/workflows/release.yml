name: Release

# Publish automatically once CI has passed for a push to main.
# semantic-release decides from the commit messages whether a release is
# needed: fix: and feat: commits publish, docs:, style: and chore: do not.
# The manual trigger remains available as a fallback.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at the same time; queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Release exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure a compatible npm version
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
