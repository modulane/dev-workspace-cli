name: Release

# Every push to main runs the CI workflow, then publishes once it has passed,
# in the same run and from the same commit. semantic-release decides from the
# commit messages whether a release is needed: fix: and feat: commits publish,
# docs:, style: and chore: do not.
# The manual trigger remains available as a fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at the same time; queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # A called workflow can use at most the permissions granted here. Its jobs
    # read the repository, and the coverage badge job deploys to GitHub Pages.
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure a compatible npm version
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        run: npm ci

      # The CI job has already run the checks on this commit, and
      # prepublishOnly runs them once more before anything is published.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
