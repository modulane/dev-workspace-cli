name: Pull request labels

# modulane/workflows labels every pull request from its Conventional Commit
# title (its kind and the release that merging it publishes) and assigns a
# new pull request to its author.
#
# pull_request_target gives the job a token that can label pull requests from
# forks. It is safe because the called workflow never checks out or runs code
# from the pull request. Never add a checkout to this workflow.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no pull request code is checked out or run
    types: [opened, edited, reopened]

permissions: {}

jobs:
  pr-labels:
    name: Pull request labels
    uses: modulane/workflows/.github/workflows/pr-labels.yml@257e72d8c09ea09b3fb0831124d667e7e7e1a915 # v1.1.0
    permissions:
      pull-requests: write # add and remove labels, assign the author
