name: CI

# Work happens on branches and reaches main through pull requests, so CI runs
# on every pull request, not twice for each branch push. On main, the Release
# workflow calls this workflow before publishing, so the commit it tests is
# the commit it releases, in the same run.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read # check out the code

# A new push to a pull request cancels the run it replaces. When Release calls
# this workflow, each run gets its own group, so CI on main is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        # The even-numbered (LTS) lines that package.json "engines" allows.
        # 20 is end-of-life but stays as long as "engines" includes it.
        node-version:
          - 20
          - 22
          - 24
          - 26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests run a real script with every supported package manager.
      # Their latest versions are installed on purpose, to test what users
      # have; this job can read the repository and nothing else.
      - name: Install pnpm and Yarn
        run: npm install --global pnpm yarn # zizmor: ignore[adhoc-packages]

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run checks and tests
        run: npm run check
        env:
          REQUIRE_ALL_PACKAGE_MANAGERS: '1'

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Generate coverage badge
        run: node scripts/generate-coverage-badge.js

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  # The one CI check the main ruleset requires, so adding or dropping a Node.js
  # version or an OS in the matrix never means editing the ruleset. It runs
  # even when a job it needs fails or is cancelled, because GitHub treats a
  # skipped required check as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::No job results to check."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job ended with \"$result\"."
              exit 1
            fi
          done

  deploy-badge:
    name: Deploy coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write # publish the badge to GitHub Pages
      id-token: write # prove to Pages that the deployment comes from this run

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
