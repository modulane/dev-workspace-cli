name: Feature
description: Propose a new feature or an improvement
labels: ['enhancement', 'needs-triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What do you want to do that the CLI makes slow or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The flags, menus or behaviour you have in mind, with examples.
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Roadmap milestone
      options:
        - 'A polished interface'
        - 'Bigger workspaces'
        - 'Configuration and scripts'
        - 'Hardening and release candidate'
        - 'After 1.0.0'
        - 'Not on the roadmap yet'
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: Required, for everyone. Say whether AI tools helped write this issue.
      options:
        - No AI tool was used
        - AI tools were used
    validations:
      required: true
  - type: textarea
    id: ai-tools
    attributes:
      label: AI tools used
      description: If AI tools were used, name each one and what it did, for example "ChatGPT summarised the error log".
